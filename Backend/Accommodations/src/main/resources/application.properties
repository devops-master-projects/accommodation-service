spring.application.name=Accommodation
server.port=8085


spring.datasource.url=jdbc:postgresql://localhost:5433/accommodation
spring.datasource.username=admin
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.initializationFailTimeout=0

spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/IdentityRealm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/IdentityRealm/protocol/openid-connect/certs
